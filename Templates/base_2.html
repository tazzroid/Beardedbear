<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}BeardedBear{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">
        <img class="brand-mark" src="{{ url_for('static', filename='img/bear-icon.png') }}" alt="BeardedBear">
        <span class="brand-name">BEARDEDBEAR</span>
      </a>

      <nav class="nav" id="primaryNav" aria-label="Primary">
        <a href="/">Home</a>
        <a href="/projects">Projects</a>
        <a href="/#about">About</a>
        <a href="/#contact">Contact</a>
      </nav>

      <div class="header-actions">
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-controls="primaryNav" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer" id="contact">
    <div class="footer-inner">
      <div class="footer-text">
        BeardedBear © All rights reserved.
      </div>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
